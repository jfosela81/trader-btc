name: BTC Trading Bot

on:
  # Ejecutar cada 15 minutos
  schedule:
    - cron: '*/15 * * * *'
  
  # Permitir ejecución manual
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Download previous state
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # El estado se cargará desde Supabase cuando esté configurado
          # Por ahora, empezamos fresco cada vez
          echo "Estado se gestionará con Supabase"
      
      - name: Run trading bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INITIAL_BALANCE_USD: ${{ vars.INITIAL_BALANCE_USD || '1000' }}
          TRADING_FEE_PERCENT: ${{ vars.TRADING_FEE_PERCENT || '0.1' }}
          DRY_RUN: 'true'
        working-directory: backend/src
        run: python main.py
      
      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-${{ github.run_number }}
          path: backend/data/bot_state.json
          retention-days: 30
